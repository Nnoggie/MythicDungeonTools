name: Localization coverage

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  localization-completeness:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Test localization checker
        run: lua5.1 scripts/check_locales.lua --self-test

      - name: Check localization coverage
        run: lua5.1 scripts/check_locales.lua
